{% extends 'base.html' %}{% block content %}<h1>Миний захиалгууд</h1>{% if orders %}<div class="list-group">{% for order in orders %}<a class="list-group-item list-group-item-action" href="{{ url_for('order_detail',order_id=order.id) }}">#{{ order.id }} · {{ '{:,}'.format(order.total) }} ₮ · {{ order.status }}</a>{% endfor %}</div>{% else %}<p>Захиалга хараахан байхгүй байна.</p>{% endif %}{% endblock %}
